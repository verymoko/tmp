<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Бразилия Амазонская робуста Хуан Травейн (анаэробная) — Сибаристика</title>
    <link rel="stylesheet" href="./product-card.css">
    <script src="./favorite.js" defer></script>
  </head>
  <body>
    <main>
      <article class="product-card" aria-labelledby="product-name">
        <div class="product-card__media">
          <img class="product-card__image" src="./assets/coffee.png" width="1328" height="1760" alt="Пачка кофе Сибаристика">
          <span class="product-card__badge">Новинка</span>
          <button class="product-card__favorite" type="button" aria-label="В избранное" aria-pressed="false" hidden>
            <img src="./assets/favorite.svg" width="16" height="16" alt="">
          </button>
        </div>
        <div class="product-card__details">
          <div class="product-card__heading">
            <h1 id="product-name">Бразилия Амазонская робуста Хуан Травейн (анаэробная)</h1>
            <p class="product-card__price">800&nbsp;₽</p>
          </div>
          <p class="product-card__notes">Тёмный шоколад, коньячные ноты, тёмный изюм</p>
          <ul class="product-card__tags" role="list">
            <li>Натуральная анаэробная</li>
            <li>Робуста 100%</li>
            <li>Микролот</li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
